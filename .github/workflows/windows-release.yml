name: Windows Release

on:
  push:
    branches:
      - main
      - master
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up WiX 3.14.1
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
          $wixBin = Join-Path $env:RUNNER_TEMP "wix314"
          Invoke-WebRequest `
            -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" `
            -OutFile $archive
          $expected = "6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($actual -ne $expected) {
            throw "WiX archive checksum mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $wixBin
          "WIX_BIN=$wixBin" >> $env:GITHUB_ENV

      - name: Build EXE, ZIP, and MSI
        shell: pwsh
        run: ./scripts/build-release.ps1 -ProductVersion "1.1.${{ github.run_number }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: AirMouse-windows-amd64
          path: |
            dist/AirMouse.exe
            dist/AirMouse-windows-amd64.zip
            dist/AirMouse-Setup-x64.msi

      - name: Update latest release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest $env:GITHUB_SHA
          git push origin latest --force

          $notes = @"
          Automated Windows build from $env:GITHUB_SHA.

          This release contains the Windows build only.
          "@

          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest `
              --title "Latest Windows Build" `
              --notes $notes `
              --target $env:GITHUB_SHA `
              --latest `
              dist/AirMouse.exe `
              dist/AirMouse-windows-amd64.zip `
              dist/AirMouse-Setup-x64.msi
          } else {
            gh release edit latest `
              --title "Latest Windows Build" `
              --notes $notes `
              --latest
            gh release upload latest `
              dist/AirMouse.exe `
              dist/AirMouse-windows-amd64.zip `
              dist/AirMouse-Setup-x64.msi `
              --clobber
          }
