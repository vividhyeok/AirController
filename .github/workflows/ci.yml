name: CI

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows:
    name: Test and build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build AirMouse.exe
        run: go build -ldflags "-s -w" -o AirMouse.exe .

      - name: Check JavaScript syntax
        shell: pwsh
        run: node --check templates/app.js
