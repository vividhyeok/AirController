<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101214">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Air Mouse</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="app-container">
        <header class="topbar">
            <div class="brand">
                <div class="app-title">Air Mouse</div>
                <div class="server-url">{{.ServerURL}}</div>
            </div>
            <div class="status-badge" id="statusBadge">
                <span class="status-dot"></span>
                <span id="statusText">Offline</span>
            </div>
        </header>

        <main class="content">
            <section class="panel panel-touch active" id="panel-touch">
                <div class="touchpad-container" id="touchpad">
                    <div class="scroll-strip" aria-hidden="true"><span>스크롤</span></div>
                </div>
            </section>

            <section class="panel" id="panel-input">
                <section class="section">
                    <div class="section-head">
                        <h2>Media</h2>
                    </div>
                    <div class="control-grid media-grid">
                        <button class="card-btn" type="button" onclick="emitKey('left')">
                            <span class="icon i-rewind"></span><span class="card-label">-5s</span>
                        </button>
                        <button class="card-btn primary" type="button" onclick="emitKey('mediaplaypause')">
                            <span class="icon i-play"></span><span class="card-label">재생/일시정지</span>
                        </button>
                        <button class="card-btn" type="button" onclick="emitKey('right')">
                            <span class="icon i-forward"></span><span class="card-label">+5s</span>
                        </button>
                        <button class="card-btn" type="button" onclick="emitKey('volumedown')">
                            <span class="icon i-volume-down"></span><span class="card-label">볼륨 -</span>
                        </button>
                        <button class="card-btn" type="button" onclick="emitKey('volumemute')">
                            <span class="icon i-volume-off"></span><span class="card-label">음소거</span>
                        </button>
                        <button class="card-btn" type="button" onclick="emitKey('volumeup')">
                            <span class="icon i-volume-up"></span><span class="card-label">볼륨 +</span>
                        </button>
                        <button class="card-btn" type="button" onclick="emitKey('mediaprevtrack')">
                            <span class="icon i-prev"></span><span class="card-label">이전</span>
                        </button>
                        <button class="card-btn" type="button" onclick="emitKey('f')">
                            <span class="icon i-fullscreen"></span><span class="card-label">전체화면</span>
                        </button>
                        <button class="card-btn" type="button" onclick="emitKey('medianexttrack')">
                            <span class="icon i-next"></span><span class="card-label">다음</span>
                        </button>
                    </div>
                </section>

                <section class="section">
                    <div class="section-head">
                        <h2>Browser</h2>
                    </div>
                    <div class="control-grid">
                        <button class="card-btn compact" type="button" onclick="emitHotkey(['alt','left'])">
                            <span class="icon i-arrow-left"></span><span class="card-label">뒤로</span>
                        </button>
                        <button class="card-btn compact" type="button" onclick="emitHotkey(['alt','right'])">
                            <span class="icon i-arrow-right"></span><span class="card-label">앞으로</span>
                        </button>
                        <button class="card-btn compact" type="button" onclick="emitKey('f5')">
                            <span class="icon i-refresh"></span><span class="card-label">새로고침</span>
                        </button>
                        <button class="card-btn compact" type="button" onclick="emitHotkey(['ctrl','t'])">
                            <span class="icon i-tab-plus"></span><span class="card-label">새 탭</span>
                        </button>
                        <button class="card-btn compact" type="button" onclick="emitHotkey(['ctrl','w'])">
                            <span class="icon i-tab-close"></span><span class="card-label">탭 닫기</span>
                        </button>
                        <button class="card-btn compact" type="button" onclick="emitKey('browserhome')">
                            <span class="icon i-home"></span><span class="card-label">홈</span>
                        </button>
                        <button class="card-btn compact" type="button" onclick="emitHotkey(['ctrl','shift','tab'])">
                            <span class="icon i-tab-prev"></span><span class="card-label">이전 탭</span>
                        </button>
                        <button class="card-btn compact" type="button" onclick="emitHotkey(['ctrl','tab'])">
                            <span class="icon i-tab-next"></span><span class="card-label">다음 탭</span>
                        </button>
                        <button class="card-btn compact" type="button" onclick="emitKey('space')">
                            <span class="keycap">Space</span><span class="card-label">스페이스</span>
                        </button>
                    </div>
                </section>

                <section class="section">
                    <div class="section-head">
                        <h2>Text Input</h2>
                    </div>
                    <div class="input-wrapper">
                        <input type="text" id="textInput" placeholder="PC에 입력할 텍스트">
                        <button class="btn-send" type="button" onclick="sendText(false)">입력</button>
                        <button class="btn-icon" type="button" onclick="sendText(true)">Enter</button>
                    </div>
                </section>

                <section class="section">
                    <div class="section-head">
                        <h2>Keys</h2>
                    </div>
                    <div class="grid-shortcuts">
                        <button class="key-btn" type="button" onclick="emitKey('enter')">Enter</button>
                        <button class="key-btn" type="button" onclick="emitKey('backspace')">Backspace</button>
                        <button class="key-btn" type="button" onclick="emitKey('esc')">ESC</button>
                        <button class="key-btn" type="button" onclick="emitKey('tab')">Tab</button>
                        <button class="key-btn" type="button" onclick="emitKey('win')">Win</button>
                        <button class="key-btn" type="button" onclick="emitKey('up')">Up</button>
                        <button class="key-btn" type="button" onclick="emitKey('down')">Down</button>
                        <button class="key-btn" type="button" onclick="emitKey('left')">Left</button>
                        <button class="key-btn" type="button" onclick="emitKey('right')">Right</button>
                    </div>
                </section>

                <section class="section">
                    <div class="range-wrap">
                        <div class="range-header"><span>마우스 감도</span><span id="mouseVal">2.5</span></div>
                        <input type="range" id="mouseSens" min="1.0" max="5.0" step="0.5" value="2.5">
                    </div>
                    <div class="range-wrap">
                        <div class="range-header"><span>스크롤 감도</span><span id="scrollVal">3</span></div>
                        <input type="range" id="scrollSens" min="1" max="5" step="0.5" value="3">
                    </div>
                </section>
            </section>

            <section class="panel" id="panel-apps">
                <section class="section">
                    <div class="section-head">
                        <h2>Apps</h2>
                    </div>
                    <div class="input-wrapper">
                        <input type="text" id="appUrlInput" placeholder="주소 또는 도메인">
                        <button class="btn-send" type="button" onclick="openAppUrl()">열기</button>
                        <button class="btn-icon" type="button" onclick="addInputFavorite()">즐겨찾기</button>
                    </div>
                </section>

                <section class="section">
                    <div class="section-head">
                        <h2>Current Tab</h2>
                        <button class="text-action" type="button" onclick="requestCurrentTab()">가져오기</button>
                    </div>
                    <div id="currentTabContainer" class="current-tab" hidden>
                        <div id="currentTabTitle" class="current-title"></div>
                        <div id="currentTabUrl" class="current-url"></div>
                        <div class="current-actions">
                            <button class="btn-send" type="button" id="openTabBtn">열기</button>
                            <button class="btn-icon" type="button" id="favTabBtn">즐겨찾기</button>
                            <button class="btn-icon" type="button" onclick="hideCurrentTab()">닫기</button>
                        </div>
                    </div>
                </section>

                <section class="section">
                    <div class="section-head">
                        <h2>즐겨찾기</h2>
                        <div class="section-actions">
                            <button class="text-action" type="button" onclick="exportPersonalization()">백업</button>
                            <button class="text-action" type="button" onclick="document.getElementById('personalizationFile').click()">복원</button>
                            <button class="text-action" type="button" onclick="clearFavorites()">비우기</button>
                            <input id="personalizationFile" type="file" accept="application/json,.json" hidden onchange="importPersonalization(event)">
                        </div>
                    </div>
                    <div id="favoritesList" class="site-list"></div>
                </section>

                <section class="section" id="recentSection">
                    <div class="section-head">
                        <h2>이전 기록</h2>
                        <button class="text-action" type="button" onclick="clearRecentHistory()">비우기</button>
                    </div>
                    <div id="recentList" class="site-list"></div>
                </section>

                <section class="section">
                    <div class="section-head">
                        <h2>Tools</h2>
                    </div>
                    <div class="grid-shortcuts">
                        <button class="key-btn" type="button" onclick="emitKey('browserhome')">Home</button>
                        <button class="key-btn" type="button" onclick="reserveSleep()">절전</button>
                    </div>
                </section>
            </section>
        </main>

        <nav class="tab-bar">
            <button class="nav-item active" type="button" data-tab="touch" onclick="switchTab('touch', this)">
                <span class="nav-icon icon i-touch"></span><span>Touch</span>
            </button>
            <button class="nav-item" type="button" data-tab="input" onclick="switchTab('input', this)">
                <span class="nav-icon icon i-keyboard"></span><span>Input</span>
            </button>
            <button class="nav-item" type="button" data-tab="apps" onclick="switchTab('apps', this)">
                <span class="nav-icon icon i-apps"></span><span>Apps</span>
            </button>
        </nav>
    </div>
</body>
</html>
