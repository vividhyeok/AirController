<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Mouse 연결</title>
    <style>
        :root {
            --bg: #101214;
            --surface: #181c20;
            --surface-2: #22282e;
            --primary: #7fb2ff;
            --ok: #8de0c8;
            --text: #f5f7fa;
            --muted: #9ca6b2;
            --border: rgba(255,255,255,0.09);
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
        }

        .card {
            width: min(420px, 100%);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px;
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            letter-spacing: 0;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.55;
        }

        .qr-frame {
            margin: 24px auto 18px;
            width: fit-content;
            padding: 12px;
            border-radius: 16px;
            background: #fff;
        }

        .qr-frame img {
            display: block;
            width: 190px;
            height: 190px;
        }

        .url-pill {
            display: block;
            width: 100%;
            padding: 13px 14px;
            border-radius: 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--primary);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .status {
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #e35d5d;
        }

        .status-dot.online {
            background: var(--ok);
        }

        .note {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            text-align: left;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Air Mouse</h1>
        <p>휴대폰이나 태블릿으로 아래 QR을 스캔하거나 주소를 직접 열어 연결합니다.</p>

        <div class="qr-frame">
            <img src="data:image/png;base64,{{.QRData}}" alt="Air Mouse QR Code">
        </div>

        <div class="url-pill">{{.AppURL}}</div>

        <div class="status">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">PC 로컬 연결 확인 중</span>
        </div>

        <div class="note">
            PC 브라우저에서 연결됨으로 보여도 휴대폰이 계속 로딩되면 휴대폰이 같은 네트워크에 있는지, Windows 방화벽에서 Air Mouse 또는 현재 포트가 허용되어 있는지 확인하세요.
        </div>
    </main>

    <script>
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(proto + '//' + location.host + '/ws');
            ws.onopen = () => {
                statusDot.classList.add('online');
                statusText.textContent = 'PC 로컬 연결됨';
            };
            ws.onclose = () => {
                statusDot.classList.remove('online');
                statusText.textContent = 'PC 로컬 연결 대기 중';
                setTimeout(connectWS, 2500);
            };
        }

        connectWS();
    </script>
</body>
</html>
